<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hydro One app – Pay with Kubra</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1557C0}a:hover{color:#0B3D91}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #C3CCD8;border-radius:12px;font-size:15px;min-height:44px;box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F8; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0F1B2D; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 16px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #DDE3EA">
    <a href="Bill.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F1B2D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600; flex: 1">Make a payment</h1>
  </header>
  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px; background: #E8F0FC; border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #0B3D91">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 11V8a6 6 0 0 1 12 0v3"/><path d="M4 11h16v10H4z"/></svg>
      Secure checkout powered by Kubra
    </div>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 600">Amount</h2>
      <label class="opt" style="border-color: #1557C0; background: #F5F8FE"><input type="radio" name="amt" checked style="width: 20px; height: 20px"><span style="flex: 1">Amount due</span><strong>$[184.27]</strong></label>
      <label class="opt"><input type="radio" name="amt" style="width: 20px; height: 20px"><span style="flex: 1">Other amount</span><span style="color: #4A5768">$ ____</span></label>
    </section>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 600">Pay with</h2>
      <label class="opt" style="border-color: #1557C0; background: #F5F8FE"><input type="radio" name="pm" checked style="width: 20px; height: 20px"><span style="flex: 1">[Saved card •••• 0000]</span></label>
      <label class="opt"><input type="radio" name="pm" style="width: 20px; height: 20px"><span style="flex: 1">Bank account (pre-authorized debit)</span></label>
      <label class="opt"><input type="radio" name="pm" style="width: 20px; height: 20px"><span style="flex: 1">Apple Pay / Google Pay</span></label>
      <a href="#new" style="font-size: 14px; padding: 8px 0">+ Add a payment method</a>
    </section>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <label for="dt" style="font-size: 15px; font-weight: 600">Payment date</label>
      <input id="dt" type="text" value="Today, Oct 21" style="height: 46px; border: 1px solid #C3CCD8; border-radius: 10px; padding: 0 14px; font-size: 15px; font-family: inherit">
    </section>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <a href="Home.dc.html" style="height: 52px; border-radius: 12px; background: #1557C0; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Pay $[184.27]</a>
      <p style="margin: 0; font-size: 12px; color: #4A5768; text-align: center">You'll get a confirmation number and an email receipt.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
