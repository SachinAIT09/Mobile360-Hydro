    </div>
    <a href="#forgot" style="font-size: 14px; align-self: flex-end">Forgot password?</a>
    <a href="Home.dc.html" style="height: 52px; border-radius: 12px; background: #1557C0; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Sign in</a>
    <a href="Home.dc.html" style="height: 52px; border-radius: 12px; border: 1px solid #C3CCD8; color: #0F1B2D; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">

    <div style="height: 1px; background: #E3E8EE; margin: 4px 0"></div>
    <a href="Outage.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: #FFF4E0; color: #5C3B00; text-decoration: none; font-size: 14px; font-weight: 500">

      Power out? Report an outage without signing in

    <p style="margin: auto 0 0; font-size: 14px; text-align: center; color: #4A5768">New to the app? <a href="#register">Register your account</a></p>
