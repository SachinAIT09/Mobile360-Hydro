<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hydro One app – Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1557C0}a:hover{color:#0B3D91}
.nav{display:flex;justify-content:space-around;align-items:center;height:76px;background:#FFFFFF;border-top:1px solid #DDE3EA;flex-shrink:0}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#4A5768;text-decoration:none;min-width:56px;min-height:44px;justify-content:center}
.ni.on{color:#1557C0;font-weight:600}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F8; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #0F1B2D; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #DDE3EA">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600">Messages</h1>
    <div role="tablist" style="display: flex; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <a href="{{m.href}}" style="{{m.card}}">
        <span style="{{m.dot}}"></span>
        <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
          <span style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
            <span style="{{m.tagStyle}}">{{m.tag}}</span>
            <span style="font-size: 12px; color: #4A5768">{{m.time}}</span>
          </span>
          <span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{m.title}}</span>
          <span style="font-size: 13px; color: #4A5768; line-height: 1.4">{{m.body}}</span>
        </span>
      </a>
    </sc-for>
  </main>
  <nav class="nav" aria-label="Main">
    <a class="ni" href="Home.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a class="ni" href="Energy.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Energy</a>
    <a class="ni" href="Bill.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h8M9 17h6"/></svg>Billing</a>
    <a class="ni" href="Outage.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>Outage</a>
    <a class="ni on" href="Inbox.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Messages</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'All' }; }
  renderVals() {
    const tagStyles = {
      'Grid alert': 'font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #8A4B00; background: #FFF1D6; padding: 2px 8px; border-radius: 8px',
      'Offer': 'font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #3B2E8F; background: #EEEAFB; padding: 2px 8px; border-radius: 8px',
      'Billing': 'font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #0B3D91; background: #E8F0FC; padding: 2px 8px; border-radius: 8px',
      'Outage': 'font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #1E6B3A; background: #E3F4E9; padding: 2px 8px; border-radius: 8px'
    };
    const all = [
      { tag: 'Grid alert', cat: 'Alerts', unread: true, time: '4:12 PM', href: 'StopCharging.dc.html', title: 'Please pause EV charging 5–8 PM today', body: 'High demand on your local line. Earn [$X] for taking part.' },
      { tag: 'Offer', cat: 'Offers', unread: true, time: 'Yesterday', href: 'Offer.dc.html', title: 'EV owners near you are saving with [DR Program Name]', body: 'Join and get [Incentive]. Takes 1 minute.' },
      { tag: 'Billing', cat: 'Billing', unread: false, time: 'Oct 15', href: 'Bill.dc.html', title: 'Your October bill is ready', body: '$[184.27] due [Nov 8].' },
      { tag: 'Outage', cat: 'Alerts', unread: false, time: 'Oct 3', href: 'Outage.dc.html', title: 'Power restored at [123 Main St]', body: 'Thanks for your patience. Cause: [tree contact].' }
    ];
    const msgs = all.filter((m) => this.state.tab === 'All' || m.cat === this.state.tab).map((m) => ({
      ...m,
      tagStyle: tagStyles[m.tag],
      card: 'display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; text-decoration: none; color: #0F1B2D; background: #FFFFFF;' + (m.unread ? ' border: 1px solid #B9CCEB;' : ' border: 1px solid transparent;'),
      dot: 'width: 8px; height: 8px; border-radius: 4px; margin-top: 7px; flex-shrink: 0; background: ' + (m.unread ? '#1557C0' : 'transparent')
    }));
    const base = 'height: 36px; padding: 0 14px; border-radius: 18px; font-family: inherit; font-size: 14px; cursor: pointer;';
    const tabs = ['All', 'Alerts', 'Offers', 'Billing'].map((l) => ({
      label: l,
      style: base + (this.state.tab === l ? ' background: #0B2545; color: #FFFFFF; border: 1px solid #0B2545; font-weight: 600;' : ' background: #FFFFFF; color: #2B3645; border: 1px solid #C3CCD8;'),
      pick: () => this.setState({ tab: l })
    }));
    return { tabs, msgs };
  }
}
</script>
</body>
</html>
