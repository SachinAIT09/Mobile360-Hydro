name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          CI: 1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            apps/api/dist
            apps/web/dist
            apps/mobile/dist
            packages/shared/dist
          retention-days: 1

  e2e:
    name: End-to-end (production build, one port)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm i --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
      # The API starts a built-in MongoDB on first run; cache the downloaded binary.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - name: Install Chromium
        run: pnpm --filter @demo/e2e exec playwright install --with-deps chromium
      - name: Run Playwright suite against `node apps/api/dist/main.js`
        run: pnpm e2e
        env:
          CI: 1
          BASE_URL: http://localhost:3000
          E2E_START_SERVER: 1
      - name: Upload report and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            tests/e2e/shots
